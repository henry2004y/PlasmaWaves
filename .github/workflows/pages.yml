name: Deploy Bonito Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1"

      - name: Cache Julia packages
        uses: julia-actions/cache@v2

      - name: Render wave animations (MP4) and diagnostic figures
        run: |
          julia --project=examples -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
          julia --project=examples examples/generate_gallery.jl gallery mp4

      - name: Build static Bonito + WGLMakie website
        env:
          BASE_URL: /${{ github.event.repository.name }}
          MEDIA_EXT: mp4
        run: |
          julia --project=web -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
          julia --project=web web/build_site.jl site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
